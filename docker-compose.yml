services:
  backend:
    build:
      context: ./backend
    container_name: trustshare-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: trustshare-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
